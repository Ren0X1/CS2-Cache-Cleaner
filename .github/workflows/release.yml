name: Release on main

# ====================================================================
#  RNX Cache Cleaner Pro - compila el .exe y el instalador y publica
#  una release con los dos.
#
#  Disparadores:
#   - push a main que toque el codigo (src/**) o el instalador
#   - workflow_dispatch (manual desde Actions, con opcion de version)
#
#  Secret necesario para que el backup a Google Drive funcione:
#   GOOGLE_CLIENT_JSON = contenido del JSON del "ID de cliente OAuth"
#                        (tipo Aplicacion de escritorio) de Google Cloud.
#   Sin el secret el programa compila igual, pero sin Google Drive.
#
#  Tip: "[skip release]" en el mensaje del commit se salta la release.
# ====================================================================

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'installer/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version a publicar (opcional, ej: 5.1.0). Vacio = Major.Minor del .csproj + numero de run.'
        required: false
        type: string
      prerelease:
        description: 'Marcar como pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    if: "!contains(github.event.head_commit.message, '[skip release]')"
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # ----------------------------------------------------------------
      # Version: input manual > <Version> del .csproj.
      # Si el tag ya existe se anade -build.<run>.
      # ----------------------------------------------------------------
      - name: Detectar version
        id: version
        shell: bash
        run: |
          set -e
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            # Major.Minor sale del .csproj; el tercer numero es el run de Actions,
            # asi cada release es mayor que la anterior y la autoactualizacion la detecta
            BASE=$(grep -oP '<Version>\K[0-9]+\.[0-9]+' src/RnxCleaner/RnxCleaner.csproj | head -n 1)
            [ -n "$BASE" ] || { echo "::error::No se pudo leer <Version> del .csproj"; exit 1; }
            VERSION="${BASE}.${{ github.run_number }}"
          fi
          TAG="v${VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::El tag $TAG ya existe"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"

      # El cliente OAuth de Google no esta en el repo (es publico): llega por secret
      - name: Cliente OAuth de Google Drive
        shell: bash
        env:
          GOOGLE_CLIENT_JSON: ${{ secrets.GOOGLE_CLIENT_JSON }}
        run: |
          if [ -n "$GOOGLE_CLIENT_JSON" ]; then
            printf '%s' "$GOOGLE_CLIENT_JSON" > src/RnxCleaner/Assets/google_client.json
            echo "Google Drive: activado"
          else
            echo "::warning::Sin secret GOOGLE_CLIENT_JSON: el .exe se compila sin Google Drive"
          fi

      - name: Publicar .exe (single-file, autocontenido)
        shell: bash
        run: dotnet publish src/RnxCleaner/RnxCleaner.csproj -c Release -o dist -p:Version=${{ steps.version.outputs.version }}

      - name: Compilar instalador MSI
        shell: bash
        run: dotnet build installer/RnxCleaner.Installer.wixproj -c Release -p:Version=${{ steps.version.outputs.version }}

      - name: Crear y empujar tag
        shell: bash
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Crear release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: RNX Cache Cleaner Pro ${{ steps.version.outputs.tag }}
          body: |
            ## RNX Cache Cleaner Pro ${{ steps.version.outputs.tag }}

            ### Descarga
            - **`RNX_Cache_Cleaner_${{ steps.version.outputs.version }}.msi`** - instalador (recomendado): menu Inicio, escritorio, desinstalador y autoactualizacion.
            - **`RNX_Cache_Cleaner.exe`** - version portable: un solo archivo, sin instalar.

            No hace falta instalar .NET. El programa pide permisos de administrador al abrirse y avisa solo cuando hay una version nueva (boton Actualizar; la configuracion se conserva).

            ### Modos desde la linea de comandos / accesos directos
            ```bat
            RNX_Cache_Cleaner.exe            :: interfaz grafica
            RNX_Cache_Cleaner.exe /rapida    :: limpieza rapida
            RNX_Cache_Cleaner.exe /completa  :: limpieza completa + TRIM + perfil NVIDIA
            RNX_Cache_Cleaner.exe /todo      :: completa + shadercache + raton + NVIDIA
            RNX_Cache_Cleaner.exe /nobackup  :: lo mismo que /todo pero sin backup
            RNX_Cache_Cleaner.exe /shader    :: solo shadercache
            RNX_Cache_Cleaner.exe /raton     :: solo raton.reg
            RNX_Cache_Cleaner.exe /nvidia    :: solo perfil NVIDIA CS2
            RNX_Cache_Cleaner.exe /backup    :: solo backup de Steam a Google Drive
            ```

            ---
            **Commit:** ${{ github.sha }}
          generate_release_notes: true
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          files: |
            dist/RNX_Cache_Cleaner.exe
            dist/RNX_Cache_Cleaner_${{ steps.version.outputs.version }}.msi
          fail_on_unmatched_files: true
